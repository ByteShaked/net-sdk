name: Build IM Network Library - Windows

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 MSVC 环境
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 缓存 Protobuf
      uses: actions/cache@v4
      with:
        path: C:\protobuf-3.19.5
        key: protobuf-3.19.5-${{ runner.os }}-x64-mt-v1
        restore-keys: |
          protobuf-3.19.5-${{ runner.os }}-x64-

    - name: 缓存 vcpkg
      uses: actions/cache@v4
      with:
        path: |
          C:\vcpkg\installed
          C:\vcpkg\packages
          C:\vcpkg\buildtrees
        key: vcpkg-boost-zlib-${{ runner.os }}-x64-v1
        restore-keys: |
          vcpkg-boost-zlib-${{ runner.os }}-x64-

    - name: 编译安装 Protobuf 3.19.5
      run: |
        if (-Not (Test-Path "C:\protobuf-3.19.5\bin\protoc.exe")) {
          Write-Host "从源码编译 Protobuf 3.19.5..."
          curl -L -o protobuf-3.19.5.tar.gz https://github.com/protocolbuffers/protobuf/releases/download/v3.19.5/protobuf-cpp-3.19.5.tar.gz
          tar -xzf protobuf-3.19.5.tar.gz
          cmake -B protobuf-build -S protobuf-3.19.5/cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=C:\protobuf-3.19.5 -Dprotobuf_WITH_ZLIB=OFF
          cmake --build protobuf-build --config Release --parallel 4
          cmake --install protobuf-build --config Release
        } else {
          Write-Host "✅ Protobuf 已从缓存恢复"
        }

    - name: 安装 vcpkg 依赖管理器
      run: |
        if (-Not (Test-Path "C:\vcpkg")) {
          Write-Host "克隆 vcpkg 仓库..."
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
        } else {
          Write-Host "✅ vcpkg 目录已存在"
        }
        cd C:\vcpkg
        .\bootstrap-vcpkg.bat

    - name: 安装依赖 (Boost + ZLIB)
      run: |
        if (-Not (Test-Path "C:\vcpkg\installed\x64-windows\include\boost\asio.hpp")) {
          Write-Host "安装 Boost 和 ZLIB..."
          C:\vcpkg\vcpkg install boost-asio:x64-windows zlib:x64-windows
        } else {
          Write-Host "✅ Boost 和 ZLIB 已从缓存恢复"
        }
        C:\vcpkg\vcpkg integrate install

    - name: 验证依赖安装
      run: |
        echo "=== Boost 安装路径 ==="
        dir C:\vcpkg\installed\x64-windows\include\boost
        echo ""
        echo "=== Protobuf 安装路径 ==="
        dir C:\protobuf-3.19.5\include\google\protobuf

    - name: 配置 CMake
      run: |
        cmake -B build-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DProtobuf_INCLUDE_DIR=C:/protobuf-3.19.5/include -DProtobuf_LIBRARIES=C:/protobuf-3.19.5/lib/libprotobuf.lib -DProtobuf_PROTOC_EXECUTABLE=C:/protobuf-3.19.5/bin/protoc.exe

    - name: 编译
      run: cmake --build build-windows --config Release --parallel 4

    - name: 检查编译产物
      run: |
        echo "=== 编译产物列表 ==="
        dir build-windows\Release
        echo ""
        echo "=== lib 目录 ==="
        dir lib
        echo ""
        echo "=== lib\Release 目录 ==="
        dir lib\Release -ErrorAction SilentlyContinue
        echo ""
        echo "=== 查找所有 .lib 和 .dll 文件 ==="
        Get-ChildItem -Path build-windows -Recurse -Include *.lib,*.dll | Select-Object FullName,Length

    - name: 打包产物
      run: |
        mkdir artifacts-windows
        mkdir artifacts-windows\include

        # 复制 DLL 和 LIB 文件（从 build-windows/Release 和 lib/Release）
        Copy-Item build-windows\Release\*.dll artifacts-windows\ -Force -ErrorAction SilentlyContinue
        Copy-Item build-windows\Release\*.lib artifacts-windows\ -Force -ErrorAction SilentlyContinue
        Copy-Item lib\Release\*.dll artifacts-windows\ -Force -ErrorAction SilentlyContinue
        Copy-Item lib\Release\*.lib artifacts-windows\ -Force -ErrorAction SilentlyContinue
        Copy-Item lib\*.dll artifacts-windows\ -Force -ErrorAction SilentlyContinue
        Copy-Item lib\*.lib artifacts-windows\ -Force -ErrorAction SilentlyContinue

        # 复制头文件
        Copy-Item include\* artifacts-windows\include\ -Recurse -Force

        echo ""
        echo "=== 打包内容 ==="
        dir artifacts-windows

        Compress-Archive -Path artifacts-windows\* -DestinationPath im_network_windows_x64.zip

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-library
        path: im_network_windows_x64.zip
        retention-days: 30

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: 下载编译产物
      uses: actions/download-artifact@v4
      with:
        name: windows-x64-library
        path: artifacts

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/im_network_windows_x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
