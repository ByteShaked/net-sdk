name: Build IM Network Library - Windows

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 MSVC 环境
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 安装 vcpkg 依赖管理器
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

    - name: 安装依赖库 (Protobuf + Boost + ZLIB)
      run: |
        # 安装 Protobuf（vcpkg会安装最新版本）
        C:\vcpkg\vcpkg install protobuf:x64-windows --recurse

        # 安装 Boost
        C:\vcpkg\vcpkg install boost-system:x64-windows

        # 安装 ZLIB
        C:\vcpkg\vcpkg install zlib:x64-windows

        # 集成到 CMake
        C:\vcpkg\vcpkg integrate install

    - name: 配置 CMake
      run: |
        cmake -B build-windows `
          -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
          -DCMAKE_BUILD_TYPE=Release

    - name: 编译
      run: cmake --build build-windows --config Release --parallel 4

    - name: 打包产物
      run: |
        mkdir artifacts-windows
        Copy-Item lib\* artifacts-windows\ -Recurse -Force
        Copy-Item include\* artifacts-windows\include\ -Recurse -Force
        Compress-Archive -Path artifacts-windows\* -DestinationPath im_network_windows_x64.zip

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-library
        path: im_network_windows_x64.zip
        retention-days: 30

  # 当打tag时自动创建Release
  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: 下载编译产物
      uses: actions/download-artifact@v4
      with:
        name: windows-x64-library
        path: artifacts

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/im_network_windows_x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
