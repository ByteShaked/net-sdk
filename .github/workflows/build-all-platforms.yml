name: Build IM Network Library - Windows

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 MSVC 环境
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: 安装 vcpkg 依赖管理器
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        C:\vcpkg\bootstrap-vcpkg.bat
        echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

    - name: 编译安装 Protobuf 3.19.5
      run: |
        curl -L -o protobuf-3.19.5.tar.gz https://github.com/protocolbuffers/protobuf/releases/download/v3.19.5/protobuf-cpp-3.19.5.tar.gz
        tar -xzf protobuf-3.19.5.tar.gz

        cmake -B protobuf-build -S protobuf-3.19.5/cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_TESTS=OFF -Dprotobuf_MSVC_STATIC_RUNTIME=OFF -DCMAKE_INSTALL_PREFIX=C:\protobuf-3.19.5

        cmake --build protobuf-build --config Release --parallel 4
        cmake --install protobuf-build --config Release

    - name: 安装其他依赖 (Boost + ZLIB)
      run: |
        C:\vcpkg\vcpkg install boost-system:x64-windows zlib:x64-windows
        C:\vcpkg\vcpkg integrate install

    - name: 验证依赖安装
      run: |
        echo "=== Boost 安装路径 ==="
        dir C:\vcpkg\installed\x64-windows\include\boost
        echo "=== Protobuf 安装路径 ==="
        dir C:\protobuf-3.19.5\include\google\protobuf

    - name: 配置 CMake
      run: |
        cmake -B build-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DProtobuf_INCLUDE_DIR=C:/protobuf-3.19.5/include -DProtobuf_LIBRARIES=C:/protobuf-3.19.5/lib/libprotobuf.lib -DProtobuf_PROTOC_EXECUTABLE=C:/protobuf-3.19.5/bin/protoc.exe -DBOOST_ROOT=C:/vcpkg/installed/x64-windows -DBoost_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include

    - name: 编译
      run: cmake --build build-windows --config Release --parallel 4

    - name: 打包产物
      run: |
        mkdir artifacts-windows
        Copy-Item lib\* artifacts-windows\ -Recurse -Force
        Copy-Item include\* artifacts-windows\include\ -Recurse -Force
        Compress-Archive -Path artifacts-windows\* -DestinationPath im_network_windows_x64.zip

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-library
        path: im_network_windows_x64.zip
        retention-days: 30

  # 当打tag时自动创建Release
  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: 下载编译产物
      uses: actions/download-artifact@v4
      with:
        name: windows-x64-library
        path: artifacts

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/im_network_windows_x64.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
