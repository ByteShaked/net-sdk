syntax = "proto3";

package tutorial;

message SendMsgInner {
	optional uint32 msgType = 1; //消息类型 1:文本消息 2：语音消息 3：视频消息  4：图片消息  5：位置消息  6：文件（压缩方式） 7: 文件（非压缩方式）8: 纯链接消息 9:群组通知消息 10: 未接来电消息 11:@功能 文本消息 12:用户自定义消息透传  13:打洞前收集内外网映射地址消息，透传 20：协同服务器透传使用 21：发送即焚消息通知 22：匿名模式开关通知 24:消息已读通知 25:消息撤回通知 26:命令消息 30:SDK透传json消息(现恒丰朋友圈使用)
	optional string msgId = 2; //消息ID
	optional bytes msgContent = 3;//文本消息内容
	optional string msgSender = 4; //发送者账号
	optional string msgReceiver = 5;//接收者账号
	optional string msgDomain = 6; //需要扩展的消息字段放在这里
	optional string msgFileName = 7; //消息文件名
	optional uint32 msgCompressLen = 8; //本文消息的源长度，如果消息内容经过压缩该字段大于0
	optional bytes msgData = 9; //语音数据 注意：为了保持跟发送文本的一致体验，把60s语音当做特殊文本，必须经过压缩（小于60K），才允许使用该字段。
	optional uint32 anonymity  = 10;//是否匿名消息 1 匿名 0或不传为正常消息
	optional string extOpts = 11;// 平台业务扩展字段
}
