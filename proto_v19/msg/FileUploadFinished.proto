syntax = "proto3";

package tutorial;
message FileUploadFinishedInner{
	optional string token = 1;//上传附件的token
        optional string serverNo = 2;// 文件服务器编号
        optional string path = 3;// 文件存放的相对路径/{appId}/{date}
	optional string appId = 4;// 应用ID
	optional uint32 msgType = 5; //消息类型 1：文本消息 2：语音消息 3：视频消息  4：图片消息  5：位置消息  6：文件 
	optional string msgId = 6; //消息ID
	optional string msgSender = 7; //发送者账号
	optional string msgReceiver = 8;//接收者账号
	optional string msgDomain = 9; //需要扩展的消息字段放在这里
	optional string msgFileName = 10; //消息文件名
	optional string msgLocalName = 11; //服务器生成的文件名
	optional string deviceNo = 12; // 设备号
	optional string deviceType = 13; // 设备类型
	optional string msgFileSize = 14; // 文件大小(字节)
	optional string connectorAddr = 15;
	optional uint32 anonymity  = 16;//是否匿名消息 1 匿名 0或不传为正常消息
	optional string extOpts  = 17;//平台业务扩展字段
}