option java_package = "com.yuntongxun.auth.core.protobuf";
//option optimize_for = LITE_RUNTIME;;

message PersonInfoInner {
  optional string nickName = 1; // 用户昵称
	optional uint32 sex = 2; // 性别  1:男  2：女
  optional string birth = 3; // 生日  格式 2015-12-31
	optional string sign = 4; // 签名  最大字数100个汉字
  optional string region = 5; // 地区  最大字数32个汉字
  optional string phoneNum = 6; // 电话  最大字数16个汉字
}
