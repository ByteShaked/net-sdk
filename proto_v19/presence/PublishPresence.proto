syntax = "proto3";

package tutorial;
message PublishPresenceInner {
	optional uint32 type = 1; //类型 1：在线 2：离线
	optional uint32 subType = 2; // 在线子类型 1:  请勿打扰  2：离开 3：忙碌 4：隐身
	optional uint32 network = 3; // 1: WIFI 2: 4G  3: 3G  4: 2G(EDGE) 5: INTERNET  6: other
	optional string userdata = 4; // 私有数据
}
