syntax = "proto3";

package tutorial;

message SearchGroupsRespInner{
	repeated GroupSearchInfo groups=1;//群组数组
	optional uint32 pageNo = 2;  //名称搜索时返回的当前页
	optional uint32 pageSize = 3; //名称搜索时返回的每页数量
}

message GroupSearchInfo{
	optional string groupId = 1;
	optional string name = 2; //最大20字符
        optional string owner = 3; //群组创建者
	optional uint32 permission = 4; //群组权限 1：默认可直接加入  2：需要身份验证    3:私有群组（不能主动加入，仅能管理员邀请）
	optional string declared = 5; //群组公告
	optional uint32 memberCount = 6; //群组中成员人数
	optional uint32 scope = 7; // 群组规模 群组规模 1：临时组(上限100人) 2普通组(上限300人)3：普通组(上限500人) 4：付费普通组 (上限1000人) 5：付费VIP组（上限2000人）
	optional string groupDomain = 8;  //群组扩展信息（用于第三方应用传递自己的数据）
	optional uint32 isForbid= 9; //外汇项目使用 1：非禁言  2：禁言
}