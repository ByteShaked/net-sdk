option java_package = "com.yuntongxun.presence.core.protobuf";
//option optimize_for = LITE_RUNTIME;

message BatchSetDisturbInner{
	optional uint32 type = 1 ;//1:设置免打扰 2:取消免打扰
	repeated SetDisturbListInner userAccs=2;//账号
}

message SetDisturbListInner{
	optional string userAcc = 1;//账号
	optional string setUserAcc = 2;//免打扰账号
}

