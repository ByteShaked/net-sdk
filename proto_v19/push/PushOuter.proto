syntax = "proto3";

package tutorial;

message PushOuterInner{
	optional uint32 actionType = 1 ;//[default = 1]; // 推送类别   1：账号   2：群组
	optional string appId = 2; //版本号
	optional uint32 msgType = 3; //消息类型 1:文本消息 2：语音消息 3：视频消息  4：图片消息  5：位置消息  6：文件 
	optional bytes msgContent = 4;//文本消息内容
	optional string msgSender = 5; //发送者账号 （这里是简单账号，不包含appId）
	repeated string msgReceiver=6; // 接收者账号（这里是简单账号，不包含appId）
	optional string msgDomain = 7; //需要扩展的消息字段放在这里
	optional string msgFileName = 8; //消息文件名
	optional string msgFileUrl = 9; //消息下载地址
	optional string msgFileSize = 10; //消息下载地址（字节）
	optional uint32 msgCompressLen = 11; //本文消息的源长度，如果消息内容经过压缩该字段大于0
	optional bytes msgData = 12; //语音数据 注意：为了保持跟发送文本的一致体验，把60s语音当做特殊文本，必须经过压缩（小于60K），才允许使用该字段。
	optional uint32 msgLength = 13; // 包体的数据长度
	optional string senderNickName = 14; // 发送者的昵称
	optional uint32 unReadSize = 15 ;//[default = 1]; // 接收者未读条数（用于苹果推送）
}
